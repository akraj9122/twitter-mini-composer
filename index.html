<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hindi-English Mini Composer</title>

  <meta name="description"
        content="Free Hindi-English Mini Composer. Write, copy, and share posts on X.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f0f4f8;
      color: #17202a;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 650px;
      margin: 30px auto;
      padding: 24px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      font-size: 27px;
    }

    .subtitle {
      text-align: center;
      color: #667085;
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-weight: bold;
    }

    textarea,
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
      line-height: 1.6;
    }

    input:focus,
    textarea:focus {
      outline: 2px solid #84caff;
      border-color: #1570ef;
    }

    .counter {
      text-align: right;
      margin-top: 8px;
      color: #667085;
      font-size: 13px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 13px 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .copy {
      background: #1570ef;
      color: white;
    }

    .xpost {
      background: #111111;
      color: white;
    }

    .clear {
      background: #fee4e2;
      color: #b42318;
    }

    .sample {
      background: #e0f2fe;
      color: #075985;
    }

    .status {
      min-height: 24px;
      margin-top: 15px;
      text-align: center;
      color: #067647;
      font-size: 14px;
    }

    .note {
      margin-top: 20px;
      color: #667085;
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 450px) {
      body {
        padding: 10px;
      }

      .container {
        padding: 18px;
        margin: 12px auto;
      }

      h1 {
        font-size: 23px;
      }

      .buttons {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <h1>✍️ Mini Composer</h1>

    <p class="subtitle">
      हिंदी + English | Free Post Writer
    </p>

    <label for="postText">अपनी पोस्ट लिखें / Write your post</label>

    <textarea
      id="postText"
      maxlength="10000"
      placeholder="यहाँ हिंदी या English में लिखें...

Write your thoughts here..."
      oninput="updateCounter()"
    ></textarea>

    <div class="counter">
      <span id="count">0</span> characters
    </div>

    <label for="hashtags">Hashtags (वैकल्पिक)</label>

    <input
      id="hashtags"
      type="text"
      placeholder="#Hindi #India #Technology"
    >

    <div class="buttons">

      <button class="copy" onclick="copyPost()">
        📋 Copy Post
      </button>

      <button class="xpost" onclick="postToX()">
        𝕏 Post on X
      </button>

      <button class="sample" onclick="insertSample()">
        ✨ Sample Post
      </button>

      <button class="clear" onclick="clearPost()">
        🗑️ Clear
      </button>

    </div>

    <div class="status" id="status" aria-live="polite"></div>

    <p class="note">
      यह एक स्वतंत्र HTML टूल है। किसी सर्वर या API की आवश्यकता नहीं है।
      Copy Post से टेक्स्ट कॉपी करें। Post on X से X का पोस्ट कंपोज़र
      खुलेगा, जहाँ आप पोस्ट को जाँचकर प्रकाशित कर सकते हैं।
    </p>

  </main>

  <script>
    const postText = document.getElementById("postText");
    const hashtags = document.getElementById("hashtags");
    const count = document.getElementById("count");
    const status = document.getElementById("status");

    function updateCounter() {
      count.textContent = postText.value.length;
    }

    function getFullPost() {
      const text = postText.value.trim();
      const tags = hashtags.value.trim();

      if (text && tags) {
        return text + "\n\n" + tags;
      }

      return text || tags;
    }

    async function copyPost() {
      const text = getFullPost();

      if (!text) {
        status.textContent = "पहले अपनी पोस्ट लिखें!";
        return;
      }

      try {
        await navigator.clipboard.writeText(text);
        status.textContent = "✅ पोस्ट कॉपी हो गई!";
      } catch (error) {
        postText.focus();
        postText.select();

        try {
          const success = document.execCommand("copy");

          status.textContent = success
            ? "✅ पोस्ट कॉपी हो गई!"
            : "टेक्स्ट चुन लिया गया है। अब Copy करें।";
        } catch (e) {
          status.textContent =
            "टेक्स्ट चुन लिया गया है। अब Copy करें।";
        }
      }
    }

    function postToX() {
      const text = getFullPost();

      if (!text) {
        status.textContent = "पहले अपनी पोस्ट लिखें!";
        return;
      }

      const url =
        "https://twitter.com/intent/tweet?text=" +
        encodeURIComponent(text);

      window.open(url, "_blank", "noopener,noreferrer");

      status.textContent =
        "X खुल गया है। अपनी पोस्ट जाँचें और प्रकाशित करें।";
    }

    function insertSample() {
      postText.value =
        "नमस्ते दोस्तों! 👋\n\n" +
        "यह मेरा Hindi-English Mini Composer है। " +
        "अब हिंदी और English में पोस्ट लिखना आसान है। 🚀\n\n" +
        "आपको यह टूल कैसा लगा?";

      hashtags.value = "#Hindi #India #Technology";

      updateCounter();
      status.textContent = "✨ Sample post तैयार है!";
    }

    function clearPost() {
      postText.value = "";
      hashtags.value = "";

      updateCounter();
      status.textContent = "पोस्ट साफ़ कर दी गई है।";
      postText.focus();
    }
  </script>

</body>
</html>
